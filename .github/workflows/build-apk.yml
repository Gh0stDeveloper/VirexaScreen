name: Construir APK Release

on:
  push:
    branches: ["main"]
    
permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Release
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Descargar código
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: ⚡ Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔐 Restaurar keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/ghostnexora-release.jks

      - name: 🧪 Verificar keystore
        run: |
          ls -lh app/ghostnexora-release.jks
          keytool -list \
            -v \
            -keystore app/ghostnexora-release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}"

      - name: ⚙️ Crear local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 🔧 Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: 🧪 Validar proyecto
        run: ./gradlew lintDebug testDebugUnitTest --no-daemon --stacktrace

      - name: 🛠️ Compilar APK Release firmado
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/ghostnexora-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📦 Preparar APK
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          cp app/build/outputs/apk/release/app-release.apk "VirexaScreen-${VERSION_NAME}.apk"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: ⬆️ Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VirexaScreen-${{ env.VERSION_NAME }}
          path: VirexaScreen-${{ env.VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Crear Release y subir APK
        uses: softprops/action-gh-release@v2
        with:
          files: VirexaScreen-${{ env.VERSION_NAME }}.apk
          tag_name: v${{ env.VERSION_NAME }}-build.${{ github.run_number }}
          name: Virexa Screen ${{ env.VERSION_NAME }}
          body: |
            APK release firmado de Virexa Screen `${{ env.VERSION_NAME }}`.

            - Compilación: #${{ github.run_number }}
            - Commit: `${{ github.sha }}`
            - Incluye controles flotantes interactivos, captura a pantalla completa y marca de agua estable.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
